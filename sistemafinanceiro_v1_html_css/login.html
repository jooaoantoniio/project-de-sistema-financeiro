<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Meu Financeiro</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="cabecalho-login">
    <span class="cabecalho-login__logo">Meu Financeiro</span>
  </header>

  <main class="conteudo-principal conteudo-principal--centralizado">
    <form class="formulario" action="#" method="post">

      <div class="campo">
        <label class="campo__rotulo" for="email">E-mail</label>
        <input
          class="campo__entrada"
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com">
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="senha">Senha</label>
        <input
          class="campo__entrada"
          type="password"
          id="senha"
          name="senha"
          placeholder="Sua senha">
      </div>

      <button type="submit" class="botao botao--destaque">Entrar</button>

      <div class="links-auxiliares">
        <a href="#">Criar conta</a>
        <a href="#">Esqueci minha senha</a>
      </div>

    </form>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Meu Financeiro. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
