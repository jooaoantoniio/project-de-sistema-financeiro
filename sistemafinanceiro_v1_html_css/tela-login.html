<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
</head>
<body>

  <header>
    <h1 id="titulo-login">Login:</h1>
  </header>

  <main>
    <form action="#" method="post" aria-labelledby="titulo-login">
      <p>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="username" placeholder="Digite seu nome" required>
      </p>

      <p>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Digite sua senha" required>
      </p>

      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="exemplo@email.com" required>
      </p>

      <p>
        <button type="submit">Entrar</button>
      </p>
    </form>

    <nav aria-label="Opções de conta">
      <ul>
        <li><a href="#">Criar conta</a></li>
        <li><a href="#">Esqueci minha senha</a></li>
      </ul>
    </nav>
  </main>

  <footer>
    <p><small>&copy; 2026 Meu Financeiro</small></p>
  </footer>

</body>
</html>
