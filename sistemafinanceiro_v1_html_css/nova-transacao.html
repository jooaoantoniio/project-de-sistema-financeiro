<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Transação - Meu Financeiro</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="cabecalho">
    <span class="cabecalho__logo">Meu Financeiro</span>

    <nav class="navegacao">
      <a class="navegacao__link" href="dashboard.html">Dashboard</a>
      <a class="navegacao__link" href="transacoes.html">Transações</a>
      <a class="navegacao__link navegacao__link--ativo" href="nova-transacao.html">Nova Transação</a>
    </nav>

    <div class="cabecalho__usuario">
      <img
        class="cabecalho__avatar"
        src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='64'%3E%3Crect width='64' height='64' rx='32' fill='%232563eb'/%3E%3Ctext x='32' y='40' font-size='24' fill='white' text-anchor='middle' font-family='Arial'%3EAS%3C/text%3E%3C/svg%3E"
        alt="Foto de perfil de Ana Souza">
      <span class="cabecalho__nome-usuario">Ana Souza</span>
    </div>
  </header>

  <main class="conteudo-principal conteudo-principal--centralizado">
    <h1 class="titulo-pagina">Nova Transação</h1>

    <form class="formulario" action="#" method="post">

      <div class="campo">
        <label class="campo__rotulo" for="tipo-transacao">Tipo</label>
        <select class="campo__entrada" id="tipo-transacao" name="tipo-transacao">
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="valor">Valor</label>
        <input
          class="campo__entrada"
          type="number"
          id="valor"
          name="valor"
          step="0.01"
          placeholder="0,00">
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="descricao">Descrição</label>
        <input
          class="campo__entrada"
          type="text"
          id="descricao"
          name="descricao"
          placeholder="Ex: Mercado do mês">
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="data">Data</label>
        <input
          class="campo__entrada"
          type="date"
          id="data"
          name="data">
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="categoria">Categoria</label>
        <select class="campo__entrada" id="categoria" name="categoria">
          <option value="">Selecione uma categoria</option>
          <option value="alimentacao">Alimentação</option>
          <option value="transporte">Transporte</option>
          <option value="moradia">Moradia</option>
          <option value="lazer">Lazer</option>
          <option value="saude">Saúde</option>
          <option value="salario">Salário</option>
        </select>
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="conta">Conta</label>
        <select class="campo__entrada" id="conta" name="conta">
          <option value="">Selecione uma conta</option>
          <option value="corrente">Conta Corrente</option>
          <option value="cartao">Cartão</option>
          <option value="dinheiro">Dinheiro</option>
        </select>
      </div>

      <div class="acoes-formulario">
        <button type="button" class="botao botao--secundario">Cancelar</button>
        <button type="submit" class="botao botao--destaque">Salvar transação</button>
      </div>

    </form>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Meu Financeiro. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
