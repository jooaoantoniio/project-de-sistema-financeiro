<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Transação - Meu Financeiro</title>
</head>
<body>

  <header>
    <h1>Meu Financeiro</h1>
  </header>

  <main>
    <form action="#" method="post" aria-labelledby="titulo-transacao">
      <h2 id="titulo-transacao">Nova Transação</h2>

      <label for="tipo">Tipo</label>
      <select id="tipo" name="tipo" required>
        <option value="entrada">Entrada</option>
        <option value="saida">Saída</option>
      </select>

      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" name="descricao" required>

      <label for="data">Data</label>
      <input type="date" id="data" name="data" required>

      <label for="valor">Valor (R$)</label>
      <input type="number" id="valor" name="valor" min="0.01" step="0.01" required>

      <button type="submit">Salvar</button>
    </form>
  </main>

  <footer>
    <p><small>&copy; 2026 Meu Financeiro</small></p>
  </footer>

</body>
</html>
